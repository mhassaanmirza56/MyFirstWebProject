<html>
<head>
    <title>Task 3</title>
</head>
<body bgcolor="lightgray">

    <h2 align="center" style="color: red;">Continental Hotel Reservation Form</h2>

    <form>
        <table border="1" align="center" bgcolor="lightblue" cellpadding="8">
            <tr>
                <td align="right"><b>Name</b></td>
                <td><input type="text" placeholder="Enter your name" size="30"></td>
            </tr>
            <tr>
                <td align="right"><b>eMail</b></td>
                <td><input type="email" value="info@continental.pk" size="30"></td>
            </tr>
            <tr>
                <td align="right"><b>Mobile No</b></td>
                <td><input type="text" placeholder="Enter your cell number" size="30"></td>
            </tr>
            <tr>
                <td align="right"><b>Arrival Time</b></td>
                <td><input type="text" placeholder="Enter your arrival time" size="20"></td>
            </tr>
            <tr>
                <td align="right"><b>Departure</b></td>
                <td>
                    <input type="text" size="15">
                    <input type="text" size="15">
                </td>
            </tr>
            <tr>
                <td align="right"><b>Room Type</b></td>
                <td>
                    <input type="radio" name="room"> Single
                    <input type="radio" name="room"> Double <br>
                    <input type="radio" name="room"> Presidential Suite
                </td>
            </tr>
            <tr>
                <td align="right"><b>Preferences</b></td>
                <td>
                    <input type="checkbox"> Non-Smoking <br>
                    <input type="checkbox"> Internet <br>
                    <input type="checkbox"> Firm Mattress
                </td>
            </tr>
            <tr>
                <td align="right"><b>Mode of Payment</b></td>
                <td>
                    <input type="checkbox"> Cash
                    <input type="checkbox"> Check <br>
                    <input type="checkbox"> Credit Card
                    <select>
                        <option>Select Card</option>
                        <option>Visa</option>
                        <option>MasterCard</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Send Data">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
